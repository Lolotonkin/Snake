<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Cyberpunk</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            touch-action: none;
            overflow: hidden;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
        }
        h1 span {
            color: #fff;
            text-shadow: none;
        }
        canvas {
            background-color: #0b0c10;
            border: 3px solid #1f2833;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(57, 255, 20, 0.05);
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        /* Design de la manette */
        .controls {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 12px;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(145deg, #10141e, #080a0f);
            border: 2px solid #1f2330;
            color: #8f9cae;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }
        /* Activation Néon lors de l'appui */
        .btn:active {
            transform: scale(0.92);
            background: #0d1117;
            color: #39ff14;
            border-color: #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Score: <span id="score">0</span></h1>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        
        <div class="controls">
            <div class="btn" id="up">▲</div>
            <div class="btn" id="left">◀</div>
            <div class="btn" id="right">▶</div>
            <div class="btn" id="down">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 15;
        let tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let velocity = {x: 0, y: -1}; // Démarre vers le haut directement
        let apple = {x: 5, y: 5};
        let score = 0;
        let gameOver = false;
        let pulse = 0;

        function gameLoop() {
            pulse += 0.1;
            if (gameOver) {
                // Écran de défaite stylé
                ctx.fillStyle = "rgba(5, 5, 8, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff3366";
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 10);
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#8f9cae";
                ctx.font = "14px sans-serif";
                ctx.fillText("Touche le jeu pour rejouer", canvas.width/2, canvas.height/2 + 20);
                return;
            }
            update();
            draw();
            setTimeout(gameLoop, 110);
        }

        function update() {
            if (velocity.x === 0 && velocity.y === 0) return;

            let headX = snake[0].x + velocity.x;
            let headY = snake[0].y + velocity.y;

            if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
                gameOver = true;
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === headX && snake[i].y === headY) {
                    gameOver = true;
                    return;
                }
            }

            snake.unshift({x: headX, y: headY});

            if (headX === apple.x && headY === apple.y) {
                score++;
                document.getElementById("score").innerText = score;
                generateApple();
            } else {
                snake.pop();
            }
        }

        function generateApple() {
            while (true) {
                apple.x = Math.floor(Math.random() * tileCount);
                apple.y = Math.floor(Math.random() * tileCount);
                let onSnake = false;
                for (let segment of snake) {
                    if (segment.x === apple.x && segment.y === apple.y) onSnake = true;
                }
                if (!onSnake) break;
            }
        }

        function draw() {
            // Nettoyage et arrière-plan
            ctx.fillStyle = "#0b0c10";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin de la grille technologique discrète
            ctx.strokeStyle = "rgba(31, 40, 51, 0.3)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // Dessin de la Pomme Néon (avec effet de pulsation)
            let appleRadius = (gridSize / 2 - 2) + Math.sin(pulse) * 0.8;
            ctx.shadowBlur = 12 + Math.sin(pulse) * 4;
            ctx.shadowColor = "#ff3366";
            ctx.fillStyle = "#ff3366";
            ctx.beginPath();
            ctx.arc(apple.x * gridSize + gridSize/2, apple.y * gridSize + gridSize/2, appleRadius, 0, Math.PI*2);
            ctx.fill();

            // Dessin du Serpent Cyber
            for (let i = 0; i < snake.length; i++) {
                let radius = i === 0 ? 6 : 4; // Tête plus arrondie
                ctx.shadowBlur = i === 0 ? 15 : 8;
                ctx.shadowColor = "#39ff14";
                ctx.fillStyle = i === 0 ? "#66ff66" : "#39ff14";
                
                // Tracé de chaque bloc arrondi
                let x = snake[i].x * gridSize + 1;
                let y = snake[i].y * gridSize + 1;
                let w = gridSize - 2;
                let h = gridSize - 2;
                
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();

                // Ajout des petits yeux stylisés sur la tête
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#000";
                    // Positions adaptées sommairement au centre
                    ctx.fillRect(x + 3, y + 5, 2, 2);
                    ctx.fillRect(x + 8, y + 5, 2, 2);
                }
            }
            // Reset des ombres pour éviter les bugs de performance
            ctx.shadowBlur = 0;
        }

        function changeDirection(x, y) {
            if (x !== 0 && velocity.x !== 0) return;
            if (y !== 0 && velocity.y !== 0) return;
            velocity = {x, y};
        }

        // Ecouteurs tactiles réactifs
        document.getElementById("up").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, -1); });
        document.getElementById("down").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, 1); });
        document.getElementById("left").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(-1, 0); });
        document.getElementById("right").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(1, 0); });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (gameOver) {
                snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
                velocity = {x: 0, y: -1};
                score = 0;
                document.getElementById("score").innerText = score;
                gameOver = false;
                gameLoop();
            }
        });

        gameLoop();
    </script>
</body>
</html>
