<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade - Laurent</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background: #050508; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* Menus */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; padding: 20px; }
        .active { display: flex; }
        h1 { color: #39ff14; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); margin-bottom: 20px; text-align: center; }
        .sig { font-size: 12px; color: #8f9cae; text-transform: uppercase; letter-spacing: 2px; margin-top: -10px; margin-bottom: 30px; text-align: center; }
        .btn-menu { background: #10141e; border: 2px solid #39ff14; color: #39ff14; padding: 15px 20px; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 10px; margin: 10px 0; width: 100%; cursor: pointer; }
        .btn-menu:active { background: #39ff14; color: #050508; }
        
        /* Canvas partagés */
        canvas { background: #0b0c10; border: 2px solid #1f2833; border-radius: 12px; margin-bottom: 20px; }
        #snakeCanvas, #platCanvas { width: 90vw; height: 90vw; max-width: 320px; max-height: 320px; }
        #tirCanvas { background: linear-gradient(#1a1a2e, #050508); width: 95vw; max-width: 400px; height: 250px; margin-bottom: 10px; cursor: crosshair; }
        
        /* Boutons de contrôle (Snake & Platformer) */
        .controls-snake { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-bottom: 20px; }
        .controls-plat { display: flex; justify-content: space-between; width: 100%; max-width: 300px; margin-bottom: 20px; }
        .plat-dir { display: flex; gap: 10px; }
        .btn-s { background: #10141e; border: 1px solid #39ff14; color: #39ff14; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; font-size: 24px; touch-action: none; }
        .btn-s:active { background: #39ff14; color: black; }
        
        /* UI Tir */
        .tir-ui { width: 95vw; max-width: 400px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #1e293b; text-align: center; }
        .info-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; width: 95vw; max-width: 400px;}
        #aim-inst { font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { margin-top: 15px; background: transparent; border: 1px solid #8f9cae; color: #8f9cae; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="screen-main" class="screen active">
        <h1>Arcade Mobile</h1>
        <div class="sig">Créé par Laurent</div>
        <button class="btn-menu" onclick="showScreen('screen-snake'); initSnake();">Jouer à Snake</button>
        <button class="btn-menu" onclick="showScreen('screen-tir-menu')">Jeu de Tir (Castle Siege)</button>
        <button class="btn-menu" onclick="showScreen('screen-plat'); initPlat();">Micro Platformer (Mario)</button>
    </div>

    <div id="screen-tir-menu" class="screen">
        <h1>Castle Siege</h1>
        <button class="btn-menu" onclick="startTir('1v1')">Mode 1 vs 1</button>
        <button class="btn-menu" onclick="startTir('ia-easy')">1 vs IA (Facile)</button>
        <button class="btn-menu" onclick="startTir('ia-med')">1 vs IA (Moyen)</button>
        <button class="btn-menu" onclick="startTir('ia-hard')">1 vs IA (Difficile)</button>
        <button class="back-btn" onclick="showScreen('screen-main')">Retour</button>
    </div>

    <div id="screen-snake" class="screen">
        <h2 style="color:#39ff14; margin-bottom:10px; width:100%; max-width:320px; text-align:left;">Score: <span id="snake-score">0</span></h2>
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <div class="controls-snake">
            <div class="btn-s" id="up" style="grid-column: 2; grid-row: 1;">▲</div>
            <div class="btn-s" id="left" style="grid-column: 1; grid-row: 2;">◀</div>
            <div class="btn-s" id="right" style="grid-column: 3; grid-row: 2;">▶</div>
            <div class="btn-s" id="down" style="grid-column: 2; grid-row: 3;">▼</div>
        </div>
        <button class="back-btn" onclick="showScreen('screen-main')">Quitter Snake</button>
    </div>

    <div id="screen-tir" class="screen">
        <div class="info-bar">
            <span id="hp1" style="color:#39ff14;">J1: 100%</span>
            <span id="tour-txt">Tour: J1</span>
            <span id="hp2" style="color:#ff3366;">J2: 100%</span>
        </div>
        <canvas id="tirCanvas" width="400" height="250"></canvas>
        <div class="tir-ui">
            <p id="aim-inst" style="color:#39ff14;">Glisse le doigt vers l'avant !</p>
        </div>
        <button class="back-btn" onclick="showScreen('screen-main')">Quitter la partie</button>
    </div>

    <div id="screen-plat" class="screen">
        <h2 style="color:#39ff14; margin-bottom:10px;">Atteins le bloc doré !</h2>
        <canvas id="platCanvas" width="300" height="300"></canvas>
        <div class="controls-plat">
            <div class="plat-dir">
                <div class="btn-s" id="p-left">◀</div>
                <div class="btn-s" id="p-right">▶</div>
            </div>
            <div class="btn-s" id="p-jump">▲</div>
        </div>
        <button class="back-btn" onclick="stopPlat(); showScreen('screen-main')">Quitter le jeu</button>
    </div>

<script>
    // --- GESTION DES ECRANS ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    }

    // ==========================================
    // ============ JEU SNAKE ===================
    // ==========================================
    const cvsSnake = document.getElementById("snakeCanvas");
    const ctxS = cvsSnake.getContext("2d");
    let s_snake, v_snake, apple, s_score, s_go, snakeInterval;

    function initSnake() {
        s_snake = [{x:10,y:10}]; v_snake = {x:0,y:-1}; apple = {x:5,y:5}; s_score = 0; s_go = false;
        document.getElementById("snake-score").innerText = s_score;
        if(snakeInterval) clearInterval(snakeInterval);
        snakeInterval = setInterval(loopSnake, 120);
    }

    function loopSnake() {
        if(s_go) {
            ctxS.fillStyle="rgba(0,0,0,0.5)"; ctxS.fillRect(0,0,300,300);
            ctxS.fillStyle="#ff3366"; ctxS.textAlign="center"; ctxS.font="20px sans-serif";
            ctxS.fillText("PERDU ! Touche l'écran", 150, 150);
            return;
        }
        let head = {x: s_snake[0].x + v_snake.x, y: s_snake[0].y + v_snake.y};
        if(head.x<0 || head.x>19 || head.y<0 || head.y>19 || s_snake.some(p => p.x==head.x && p.y==head.y)) { s_go = true; return; }
        s_snake.unshift(head);
        if(head.x == apple.x && head.y == apple.y) { s_score++; document.getElementById("snake-score").innerText = s_score; apple = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)}; }
        else s_snake.pop();

        ctxS.fillStyle = "#0b0c10"; ctxS.fillRect(0,0,300,300);
        ctxS.fillStyle = "#ff3366"; ctxS.fillRect(apple.x*15, apple.y*15, 14, 14);
        ctxS.fillStyle = "#39ff14"; s_snake.forEach((p,i) => ctxS.fillRect(p.x*15, p.y*15, 14, 14));
    }

    ["up", "down", "left", "right"].forEach(id => {
        document.getElementById(id).addEventListener("touchstart", (e) => {
            e.preventDefault();
            if(id=="up" && v_snake.y==0) v_snake={x:0,y:-1}; else if(id=="down" && v_snake.y==0) v_snake={x:0,y:1};
            else if(id=="left" && v_snake.x==0) v_snake={x:-1,y:0}; else if(id=="right" && v_snake.x==0) v_snake={x:1,y:0};
        });
    });
    cvsSnake.addEventListener('touchstart', ()=>{ if(s_go) initSnake(); });


    // ==========================================
    // ============ JEU DE TIR ==================
    // ==========================================
    const cvsTir = document.getElementById("tirCanvas");
    const ctxT = cvsTir.getContext("2d");
    let tirMode, turn, hp1, hp2, traj1, traj2, isFiring;
    let isDragging = false, dragStart = {x:0,y:0}, aimAngle = 45, aimPower = 50;

    function startTir(mode) {
        tirMode = mode; turn = 1; hp1 = 100; hp2 = 100; traj1 = []; traj2 = []; isFiring = false;
        showScreen('screen-tir');
        updateTirUI(); drawTir();
    }

    function updateTirUI() {
        document.getElementById('hp1').innerText = "J1: " + hp1 + "%";
        document.getElementById('hp2').innerText = (tirMode==='1v1' ? "J2" : "IA") + ": " + hp2 + "%";
        document.getElementById('tour-txt').innerText = "Tour: " + (turn === 1 ? "J1" : (tirMode==='1v1' ? "J2" : "IA"));
        const inst = document.getElementById('aim-inst');
        if(turn === 1) { inst.innerText = "Glisse le doigt vers l'avant ! (J1)"; inst.style.color = "#39ff14"; } 
        else {
            if(tirMode === '1v1') { inst.innerText = "Glisse le doigt vers l'avant ! (J2)"; inst.style.color = "#ff3366"; } 
            else { inst.innerText = "L'IA calcule son tir..."; inst.style.color = "#8f9cae"; setTimeout(iaTurn, 1000); }
        }
    }

    function drawTir() {
        ctxT.clearRect(0,0,400,250);
        ctxT.fillStyle = '#1e293b'; ctxT.beginPath(); ctxT.moveTo(150,250); ctxT.lineTo(200,100); ctxT.lineTo(250,250); ctxT.fill();
        if(hp1 > 0) { ctxT.fillStyle = '#39ff14'; ctxT.fillRect(20, 250 - (hp1*0.6), 30, hp1*0.6); }
        if(hp2 > 0) { ctxT.fillStyle = '#ff3366'; ctxT.fillRect(350, 250 - (hp2*0.6), 30, hp2*0.6); }

        ctxT.strokeStyle = 'rgba(57, 255, 20, 0.3)'; ctxT.lineWidth = 1; ctxT.beginPath();
        traj1.forEach((p, i) => i==0 ? ctxT.moveTo(p.x, p.y) : ctxT.lineTo(p.x, p.y)); ctxT.stroke();
        ctxT.strokeStyle = 'rgba(255, 51, 102, 0.3)'; ctxT.beginPath();
        traj2.forEach((p, i) => i==0 ? ctxT.moveTo(p.x, p.y) : ctxT.lineTo(p.x, p.y)); ctxT.stroke();

        if(isDragging) {
            let startX = turn === 1 ? 50 : 350; let startY = turn === 1 ? 250 - (hp1*0.6) : 250 - (hp2*0.6);
            if(startY > 240) startY = 240;
            let drawAng = (turn === 1 ? aimAngle : 180 - aimAngle) * Math.PI / 180;
            let endX = startX + Math.cos(drawAng) * aimPower; let endY = startY - Math.sin(drawAng) * aimPower;
            ctxT.strokeStyle = turn === 1 ? '#39ff14' : '#ff3366'; ctxT.lineWidth = 3; ctxT.setLineDash([5, 5]);
            ctxT.beginPath(); ctxT.moveTo(startX, startY); ctxT.lineTo(endX, endY); ctxT.stroke();
            ctxT.setLineDash([]); ctxT.lineWidth = 1;
        }
    }

    function handlePointerDown(e) {
        if(isFiring || (turn !== 1 && tirMode !== '1v1')) return;
        e.preventDefault();
        let rect = cvsTir.getBoundingClientRect();
        dragStart = { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
        isDragging = true;
    }

    function handlePointerMove(e) {
        if(!isDragging) return;
        e.preventDefault();
        let rect = cvsTir.getBoundingClientRect();
        let dx = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) - dragStart.x; 
        let dy = dragStart.y - ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top); 
        
        let dist = Math.sqrt(dx*dx + dy*dy); aimPower = Math.min(100, Math.max(20, dist * 1.5)); 
        let ang = Math.atan2(dy, dx) * 180 / Math.PI;
        
        if(turn === 1) { if(ang < 0) ang = 0; if(ang > 90) ang = 90; aimAngle = ang; } 
        else { if(ang >= 0 && ang < 90) ang = 90; if(ang < 0) ang = 180; aimAngle = 180 - ang; }
        document.getElementById('aim-inst').innerText = "Puissance: " + Math.round(aimPower) + "% - Angle: " + Math.round(aimAngle) + "°";
        drawTir();
    }

    function handlePointerUp(e) {
        if(!isDragging) return;
        isDragging = false;
        document.getElementById('aim-inst').innerText = "Tir en cours..."; drawTir();
        fireCannon(aimAngle, aimPower);
    }

    cvsTir.addEventListener('touchstart', handlePointerDown, {passive: false}); cvsTir.addEventListener('touchmove', handlePointerMove, {passive: false});
    window.addEventListener('touchend', handlePointerUp); cvsTir.addEventListener('mousedown', handlePointerDown); window.addEventListener('mousemove', handlePointerMove); window.addEventListener('mouseup', handlePointerUp);

    function fireCannon(forceAngle, forcePower) {
        if(isFiring) return;
        isFiring = true;
        let angleRad = (turn === 1 ? forceAngle : 180 - forceAngle) * Math.PI / 180;
        let x = turn === 1 ? 50 : 350; let y = turn === 1 ? 250 - (hp1*0.6) : 250 - (hp2*0.6); if (y > 240) y = 240;
        let vx = Math.cos(angleRad) * forcePower / 5; let vy = -Math.sin(angleRad) * forcePower / 5;
        let currentTraj = [];
        
        let interval = setInterval(() => {
            x += vx; y += vy; vy += 0.25; currentTraj.push({x, y});
            drawTir(); ctxT.fillStyle = 'white'; ctxT.fillRect(x, y, 4, 4);

            let hit = false;
            if(y > 250) hit = true; 
            if(y > 250 - (50 - Math.abs(x - 200))*3 && x > 150 && x < 250) hit = true; 
            if(x > 350 && x < 380 && y > 250 - (hp2*0.6)) { hit = true; if(turn===1) hp2 -= 25; } 
            if(x > 20 && x < 50 && y > 250 - (hp1*0.6)) { hit = true; if(turn===2) hp1 -= 25; } 
            
            if(hit || x < -50 || x > 450) {
                clearInterval(interval);
                if(turn === 1) traj1 = currentTraj; else traj2 = currentTraj;
                if(hp1 <= 0) { drawTir(); setTimeout(()=>alert("Le Joueur 2 / IA a détruit ton château !"), 100); isFiring=false; return; }
                if(hp2 <= 0) { drawTir(); setTimeout(()=>alert("Laurent a détruit le château adverse !"), 100); isFiring=false; return; }
                turn = turn === 1 ? 2 : 1; isFiring = false; updateTirUI();
            }
        }, 20);
    }

    function iaTurn() {
        if(hp2 <= 0 || turn === 1) return;
        let ang = 45, pwr = 60;
        if(tirMode === 'ia-easy') { ang = 20 + Math.random()*50; pwr = 30 + Math.random()*50; } 
        else if (tirMode === 'ia-med') { ang = 35 + Math.random()*20; pwr = 55 + Math.random()*20; } 
        else if (tirMode === 'ia-hard') { ang = 45 + (Math.random()*10 - 5); pwr = 68 + (Math.random()*10 - 5); }
        fireCannon(ang, pwr);
    }

    // ==========================================
    // ======== MICRO PLATFORMER (MARIO) ========
    // ==========================================
    const cvsPlat = document.getElementById("platCanvas");
    const ctxP = cvsPlat.getContext("2d");
    let p_loop, p_player, p_platforms, p_goal, p_keys;

    function initPlat() {
        p_keys = { left: false, right: false, jump: false };
        p_player = { x: 20, y: 200, width: 14, height: 14, vx: 0, vy: 0, speed: 3.5, jumpPower: -7.5, grounded: false };
        
        // Création du niveau
        p_platforms = [
            {x: 0, y: 280, w: 300, h: 20},   // Sol de départ
            {x: 100, y: 240, w: 50, h: 10},  // Plateforme 1
            {x: 180, y: 190, w: 50, h: 10},  // Plateforme 2
            {x: 80, y: 140, w: 40, h: 10},   // Plateforme 3
            {x: 15, y: 90, w: 40, h: 10}     // Plateforme finale
        ];
        p_goal = { x: 20, y: 65, w: 25, h: 25 }; // Le bloc doré à atteindre

        if(p_loop) cancelAnimationFrame(p_loop);
        loopPlat();
    }

    function stopPlat() {
        if(p_loop) cancelAnimationFrame(p_loop);
    }

    function loopPlat() {
        // --- PHYSIQUE ---
        // Mouvements horizontaux
        if (p_keys.left) p_player.vx = -p_player.speed;
        else if (p_keys.right) p_player.vx = p_player.speed;
        else p_player.vx = 0;

        // Saut
        if (p_keys.jump && p_player.grounded) {
            p_player.vy = p_player.jumpPower;
            p_player.grounded = false;
            p_keys.jump = false; // Empêche le rebond infini si on reste appuyé
        }

        // Gravité
        p_player.vy += 0.4; 
        
        p_player.x += p_player.vx;
        p_player.y += p_player.vy;

        // --- COLLISIONS ---
        // Bords de l'écran (gauche/droite)
        if (p_player.x < 0) p_player.x = 0;
        if (p_player.x + p_player.width > 300) p_player.x = 300 - p_player.width;

        p_player.grounded = false;
        
        // Collisions avec les plateformes
        for (let plat of p_platforms) {
            // AABB Collision test
            if (p_player.x < plat.x + plat.w && p_player.x + p_player.width > plat.x &&
                p_player.y < plat.y + plat.h && p_player.y + p_player.height > plat.y) {
                
                // Collision par le dessus (Atterrissage)
                if (p_player.vy > 0 && p_player.y + p_player.height - p_player.vy <= plat.y + 2) {
                    p_player.grounded = true;
                    p_player.vy = 0;
                    p_player.y = plat.y - p_player.height;
                }
                // Collision par le dessous (Tête qui tape le plafond)
                else if (p_player.vy < 0 && p_player.y - p_player.vy >= plat.y + plat.h - 2) {
                    p_player.vy = 0;
                    p_player.y = plat.y + plat.h;
                }
                // Collision sur les côtés
                else {
                    if (p_player.vx > 0) p_player.x = plat.x - p_player.width;
                    else if (p_player.vx < 0) p_player.x = plat.x + plat.w;
                }
            }
        }

        // --- DESSIN ---
        ctxP.fillStyle = "#0b0c10"; ctxP.fillRect(0, 0, 300, 300); // Fond
        
        // Plateformes
        ctxP.fillStyle = "#1e293b";
        for (let plat of p_platforms) {
            ctxP.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctxP.strokeStyle = "#39ff14"; ctxP.strokeRect(plat.x, plat.y, plat.w, plat.h);
        }

        // But (Drapeau/Carré doré)
        ctxP.fillStyle = "#ffd700"; // Or
        ctxP.fillRect(p_goal.x, p_goal.y, p_goal.w, p_goal.h);
        ctxP.fillStyle = "black"; ctxP.textAlign = "center"; ctxP.font = "12px sans-serif";
        ctxP.fillText("FIN", p_goal.x + p_goal.w/2, p_goal.y + 17);

        // Joueur
        ctxP.fillStyle = "#00bfff"; // Bleu
        ctxP.fillRect(p_player.x, p_player.y, p_player.width, p_player.height);

        // --- CONDITIONS DE VICTOIRE / DEFAITE ---
        if (p_player.x < p_goal.x + p_goal.w && p_player.x + p_player.width > p_goal.x &&
            p_player.y < p_goal.y + p_goal.h && p_player.y + p_player.height > p_goal.y) {
            ctxP.fillStyle="rgba(0,0,0,0.7)"; ctxP.fillRect(0,0,300,300);
            ctxP.fillStyle="#39ff14"; ctxP.font="24px sans-serif"; ctxP.fillText("NIVEAU RÉUSSI !", 150, 150);
            return; // Stoppe la boucle
        }

        if (p_player.y > 320) {
            ctxP.fillStyle="rgba(0,0,0,0.7)"; ctxP.fillRect(0,0,300,300);
            ctxP.fillStyle="#ff3366"; ctxP.font="24px sans-serif"; ctxP.fillText("PERDU !", 150, 150);
            setTimeout(initPlat, 1500); // Recommence après 1.5s
            return;
        }

        p_loop = requestAnimationFrame(loopPlat);
    }

    // Gestion des boutons pour le Platformer (Supporte le tactile et la souris)
    const btnEvents = {
        'p-left': 'left', 'p-right': 'right', 'p-jump': 'jump'
    };
    
    for (let [id, key] of Object.entries(btnEvents)) {
        let btn = document.getElementById(id);
        
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); p_keys[key] = true; }, {passive: false});
        btn.addEventListener('touchend', (e) => { e.preventDefault(); p_keys[key] = false; }, {passive: false});
        
        // Optionnel: pour tester sur PC
        btn.addEventListener('mousedown', (e) => { p_keys[key] = true; });
        btn.addEventListener('mouseup', (e) => { p_keys[key] = false; });
        btn.addEventListener('mouseleave', (e) => { p_keys[key] = false; });
    }

</script>
</body>
</html>
