<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake - Laurent</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050508; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .ui { text-align: center; margin-top: 10px; }
        h1 { margin: 0; font-size: 20px; color: #39ff14; text-transform: uppercase; letter-spacing: 2px; }
        .sig { font-size: 10px; color: #8f9cae; text-transform: uppercase; margin-top: 5px; }
        canvas { background: #0b0c10; border: 2px solid #1f2833; border-radius: 12px; width: 90vw; height: 90vw; max-width: 320px; max-height: 320px; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); gap: 10px; margin-bottom: 30px; }
        .btn { background: #10141e; border: 1px solid #39ff14; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #39ff14; font-size: 20px; }
        #up { grid-column: 2; grid-row: 1; } #left { grid-column: 1; grid-row: 2; } #right { grid-column: 3; grid-row: 2; } #down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Score: <span id="score">0</span></h1>
        <div class="sig">Créé par Laurent</div>
    </div>

    <canvas id="game" width="300" height="300"></canvas>

    <div class="controls">
        <div class="btn" id="up">▲</div>
        <div class="btn" id="left">◀</div>
        <div class="btn" id="right">▶</div>
        <div class="btn" id="down">▼</div>
    </div>

    <script>
        const cvs = document.getElementById("game");
        const ctx = cvs.getContext("2d");
        let s = [{x:10,y:10}], v = {x:0,y:-1}, a = {x:5,y:5}, sc = 0, go = false;

        function draw() {
            ctx.fillStyle = "#0b0c10"; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = "#ff3366"; ctx.fillRect(a.x*15, a.y*15, 13, 13);
            ctx.fillStyle = "#39ff14";
            s.forEach(p => ctx.fillRect(p.x*15, p.y*15, 13, 13));
            if(go) { ctx.fillStyle="white"; ctx.textAlign="center"; ctx.fillText("APPUYEZ POUR JOUER", 150, 150); }
        }

        function update() {
            if(go) return;
            let head = {x: s[0].x + v.x, y: s[0].y + v.y};
            if(head.x<0 || head.x>19 || head.y<0 || head.y>19 || s.some(p => p.x==head.x && p.y==head.y)) { go = true; return; }
            s.unshift(head);
            if(head.x == a.x && head.y == a.y) { sc++; document.getElementById("score").innerText = sc; a = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)}; }
            else s.pop();
        }

        document.querySelectorAll('.btn').forEach(b => b.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            if(b.id=='up' && v.y==0) v={x:0,y:-1}; if(b.id=='down' && v.y==0) v={x:0,y:1};
            if(b.id=='left' && v.x==0) v={x:-1,y:0}; if(b.id=='right' && v.x==0) v={x:1,y:0};
        }));

        cvs.addEventListener('touchstart', () => { if(go) { s=[{x:10,y:10}]; v={x:0,y:-1}; sc=0; document.getElementById("score").innerText=0; go=false; } });
        setInterval(() => { update(); draw(); }, 120);
    </script>
</body>
</html>
