<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Laurent</title>
    <style>
        body { margin: 0; background: #050508; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .menu, .game-ui { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .hidden { display: none; }
        button { padding: 15px 30px; font-size: 18px; background: #1f2833; color: #39ff14; border: 2px solid #39ff14; border-radius: 10px; cursor: pointer; }
        canvas { background: #0b0c10; border: 2px solid #1f2833; width: 90vw; max-width: 400px; height: 300px; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; }
        .btn { background: #10141e; border: 1px solid #39ff14; color: #39ff14; padding: 15px; text-align: center; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- Menu Principal -->
    <div id="menu" class="menu">
        <h1>Choisis ton jeu</h1>
        <button onclick="startGame('snake')">Snake</button>
        <button onclick="startGame('artillery')">Jeu de Tir (Castle Siege)</button>
        <div style="font-size: 10px; margin-top: 20px;">Créé par Laurent</div>
    </div>

    <!-- Interface Jeu -->
    <div id="gameScreen" class="hidden">
        <canvas id="canvas" width="400" height="300"></canvas>
        <div id="ui" class="game-ui"></div>
        <button onclick="location.reload()">Retour au Menu</button>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function startGame(type) {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        if(type === 'snake') initSnake();
        else initArtillery();
    }

    // --- LOGIQUE SNAKE (simplifiée) ---
    function initSnake() { alert("Snake lancé ! Utilise les flèches."); }

    // --- LOGIQUE JEU DE TIR ---
    function initArtillery() {
        const ui = document.getElementById('ui');
        ui.innerHTML = `
            <div>Angle: <input type="range" id="angle" min="0" max="90" value="45"></div>
            <div>Puissance: <input type="range" id="power" min="10" max="100" value="50"></div>
            <button onclick="fire()">TIRER</button>
        `;
        drawLandscape();
    }

    function drawLandscape() {
        ctx.fillStyle = '#0b0c10'; ctx.fillRect(0,0,400,300);
        ctx.fillStyle = '#39ff14'; ctx.fillRect(20, 200, 50, 100); // Château A
        ctx.fillStyle = '#ff3366'; ctx.fillRect(330, 200, 50, 100); // Château B
        ctx.fillStyle = '#8f9cae'; ctx.beginPath(); ctx.moveTo(150,300); ctx.lineTo(200,150); ctx.lineTo(250,300); ctx.fill(); // Montagne
    }

    function fire() {
        let angle = document.getElementById('angle').value * Math.PI / 180;
        let power = document.getElementById('power').value;
        let x = 70, y = 200;
        let vx = Math.cos(angle) * power / 5;
        let vy = -Math.sin(angle) * power / 5;
        
        let interval = setInterval(() => {
            x += vx; y += vy; vy += 0.5; // Gravité
            ctx.fillStyle = 'white'; ctx.fillRect(x, y, 5, 5);
            if(y > 300 || x > 400) clearInterval(interval);
        }, 30);
    }
</script>
</body>
</html>
