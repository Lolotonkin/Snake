<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Laurent</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; touch-action: none; }
        body { background: #050508; color: #39ff14; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 20px; }
        .active { display: flex; }
        canvas { background: #050508; border: 2px solid #39ff14; border-radius: 8px; box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        .btn-menu { background: transparent; border: 2px solid #39ff14; color: #39ff14; padding: 15px; width: 250px; margin: 10px; cursor: pointer; font-weight: bold; }
        .controls { display: grid; grid-template-columns: 80px 80px; gap: 20px; margin-top: 20px; }
        .btn-c { width: 80px; height: 80px; border: 2px solid #39ff14; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .btn-c:active { background: #39ff14; color: #050508; }
    </style>
</head>
<body>

    <div id="main" class="screen active">
        <h1>ARCADE</h1>
        <button class="btn-menu" onclick="loadGame('snake')">SNAKE NÉON</button>
        <button class="btn-menu" onclick="loadGame('tir')">TIR PRECIS</button>
        <button class="btn-menu" onclick="loadGame('jump')">VERTICAL JUMP</button>
    </div>

    <div id="game-screen" class="screen">
        <h2 id="score-display">Score: 0</h2>
        <canvas id="canvas" width="300" height="400"></canvas>
        <div id="ctrl" class="controls"></div>
        <button class="btn-menu" style="margin-top:20px; padding:5px;" onclick="location.reload()">MENU</button>
    </div>

<script>
    const cvs = document.getElementById("canvas");
    const ctx = cvs.getContext("2d");
    const scoreEl = document.getElementById("score-display");
    const ctrlEl = document.getElementById("ctrl");

    function loadGame(type) {
        document.getElementById('main').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        if(type === 'snake') initSnake();
        if(type === 'jump') initJump();
        if(type === 'tir') initTir();
    }

    // --- 1. SNAKE NÉON ---
    function initSnake() {
        let s = [{x:10,y:10}], v = {x:1,y:0}, f = {x:15,y:15}, score=0;
        ctrlEl.innerHTML = '<div class="btn-c" onclick="dirSnake(0,-1)">▲</div><div></div><div class="btn-c" onclick="dirSnake(-1,0)">◀</div><div class="btn-c" onclick="dirSnake(1,0)">▶</div><div></div><div class="btn-c" onclick="dirSnake(0,1)">▼</div>';
        window.dirSnake = (x,y) => { if(Math.abs(v.x)!==Math.abs(x)) v = {x,y}; };
        setInterval(() => {
            let h = {x: s[0].x+v.x, y: s[0].y+v.y};
            s.unshift(h);
            if(h.x===f.x && h.y===f.y) { score++; f={x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; } else s.pop();
            ctx.fillStyle="#050508"; ctx.fillRect(0,0,300,400);
            ctx.strokeStyle="#39ff14"; ctx.lineWidth=2;
            s.forEach((p,i) => { ctx.strokeRect(p.x*15, p.y*15, 14, 14); });
            ctx.fillStyle="#ff00ff"; ctx.fillRect(f.x*15, f.y*15, 14, 14);
            scoreEl.innerText = "Score: " + score;
        }, 150);
    }

    // --- 2. VERTICAL JUMP (Niveaux infinis) ---
    function initJump() {
        let player = {x:140, y:350, vy:0}, plats = [{x:100, y:380, w:80}], score=0, camY=0;
        ctrlEl.innerHTML = '<div class="btn-c" onclick="player.vx=-5">◀</div><div class="btn-c" onclick="player.vx=5">▶</div>';
        player.vx = 0;
        setInterval(() => {
            player.vy += 0.3; player.y += player.vy; player.x += player.vx;
            if(player.y < 200) { camY += (200 - player.y); player.y = 200; score++; }
            plats.forEach(p => {
                if(player.vx>0 && player.y+20>p.y && player.y+20<p.y+10 && player.x+10>p.x && player.x<p.x+p.w) player.vy=-8;
            });
            if(plats.length < 20) plats.push({x:Math.random()*220, y:Math.random()*-500 - camY, w:60});
            ctx.fillStyle="#050508"; ctx.fillRect(0,0,300,400);
            ctx.fillStyle="#39ff14"; ctx.fillRect(player.x, player.y - camY + 200, 14, 14);
            plats.forEach(p => ctx.fillRect(p.x, p.y - camY + 200, p.w, 10));
            scoreEl.innerText = "Hauteur: " + Math.floor(score/10);
        }, 30);
    }

    // --- 3. TIR (Contrôle tactile amélioré) ---
    function initTir() {
        let power=0;
        ctrlEl.innerHTML = '<div class="btn-c" style="width:160px; border-radius:10px" id="fire">TIRE</div>';
        const btn = document.getElementById('fire');
        btn.addEventListener('touchstart', () => { power=0; let int=setInterval(()=>power++, 10); btn.onmouseup = () => clearInterval(int); });
        btn.addEventListener('touchend', () => { alert("Puissance finale: " + power); });
    }
</script>
</body>
</html>
